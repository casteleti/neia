services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nepi
      POSTGRES_USER: nepi
      POSTGRES_PASSWORD: nepi_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nepi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nepi -d nepi"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    environment:
      NODE_ENV: development
      APP_BASE_URL: http://localhost:5173
      API_BASE_URL: http://localhost:3001
      API_PORT: 3001
      DATABASE_URL: postgresql://nepi:nepi_local@db:5432/nepi?schema=public
      SESSION_SECRET: local-compose-secret-change-before-production-12345
      ADMIN_COOKIE_SECRET: local-compose-admin-cookie-secret-change-12345
      ADMIN_ALLOWED_ORIGINS: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173,http://localhost:4174
      AI_PROVIDER: demo
      DATA_RETENTION_DAYS: 30
    ports:
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  nepi-postgres:
